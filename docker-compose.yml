services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: contractai-qdrant
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16
    container_name: contractai-postgres
    restart: unless-stopped
    networks:
      - app-network
    environment:
      POSTGRES_DB: contractai
      POSTGRES_USER: contractai
      POSTGRES_PASSWORD: contractai
    ports:
      - "127.0.0.1:54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractai -d contractai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: contractai-backend
    restart: unless-stopped
    networks:
      - app-network
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg2://contractai:contractai@postgres:5432/contractai
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: contractai-frontend
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "8080:80"
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge

volumes:
  qdrant_data:
  postgres_data:
  hf_cache:
