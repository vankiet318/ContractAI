server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx's default mime.types has no entry for .mjs, so ES module workers
    # (react-pdf's pdf.worker.min.mjs) get served as application/octet-stream
    # and browsers refuse to execute them as a module script.
    location ~* \.mjs$ {
        default_type application/javascript;
    }
}
