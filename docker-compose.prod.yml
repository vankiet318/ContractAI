# Production stack: Caddy (HTTPS + frontend) in front of the backend.
# Only Caddy is reachable from outside; Qdrant, Postgres and the backend stay on the internal network.
#
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: contractai-qdrant
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16
    container_name: contractai-postgres
    restart: unless-stopped
    networks:
      - app-network
    environment:
      POSTGRES_DB: contractai
      POSTGRES_USER: contractai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractai -d contractai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: contractai-backend
    restart: unless-stopped
    networks:
      - app-network
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg2://contractai:${POSTGRES_PASSWORD}@postgres:5432/contractai
      # Trust X-Forwarded-For from Caddy so rate limits see the real client IP, not the proxy's.
      # Safe only because the backend is not published outside the internal network.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy

  caddy:
    build: ./frontend
    container_name: contractai-caddy
    restart: unless-stopped
    networks:
      - app-network
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge

volumes:
  qdrant_data:
  postgres_data:
  hf_cache:
  caddy_data:
  caddy_config:
